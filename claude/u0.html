<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>單元 0｜文法術語 Gramática</title>
<link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <div class="topbar"></div>

  <div class="wrap">
    <div class="hero">
      <h1>單元 0・文法術語</h1>
      <p>Gramática — 工具單元：先把文法名詞的中西英對照弄熟，後面單元會一直用到。</p>
    </div>

    <div id="badgeRow"></div>

    <div class="note-box">
      <b>為什麼要先學這個？</b> 後面每個單元都會用「<b>冠詞</b>／<b>名詞</b>／<b>形容詞</b>／<b>動詞</b>」這些文法術語來解說。
      這個單元把常用術語的<b>西文、繁中、英文</b>對照一次學完，之後看到解說就不會卡住。
    </div>

    <div class="tabs">
      <div class="tab active" data-panel="cards">🖼 圖卡</div>
      <div class="tab" data-panel="quiz">📝 測驗</div>
      <div class="tab" data-panel="speak">🗣 口說</div>
    </div>

    <div class="panel active" id="panel-cards"></div>
    <div class="panel" id="panel-quiz"></div>
    <div class="panel" id="panel-speak"></div>
  </div>

  <script src="./js/app.js"></script>
  <script src="./js/rewards.js"></script>
  <script src="./data/audio-manifest.js"></script>
  <script src="./data/u0-data.js"></script>
  <script src="./js/unit-engine.js"></script>
  <script>
    "use strict";
    const UNIT_ID = "u0";
    const KINDS = ["cards", "quiz", "speak"];

    renderTopbar("單元 0・文法術語");

    const raw = window.UNIT_DATA.u0;
    const deck = UnitEngine.fromGQD(UNIT_ID, raw);
    const totals = { cards: deck.cards.length, speak: deck.speak.length, story: 0 };

    function refreshBadges() {
      Rewards.renderBadgeRow($("#badgeRow"), UNIT_ID, KINDS, totals);
    }
    refreshBadges();

    let cardsStarted = false, quizStarted = false, speakStarted = false;

    function startCards() {
      if (cardsStarted) return;
      cardsStarted = true;
      new UnitEngine.CardEchoPlayer($("#panel-cards"), UNIT_ID, deck.cards, deck.groups);
    }
    function startQuiz() {
      if (quizStarted) return;
      quizStarted = true;
      new UnitEngine.QuizRunner($("#panel-quiz"), UNIT_ID, deck.quiz, { sessionSize: 12 });
    }
    function startSpeak() {
      if (speakStarted) return;
      speakStarted = true;
      new UnitEngine.SpeakRunner($("#panel-speak"), UNIT_ID, deck.speak);
    }
    startCards();

    $all(".tab").forEach((tab) => {
      tab.addEventListener("click", () => {
        $all(".tab").forEach((t) => t.classList.remove("active"));
        $all(".panel").forEach((p) => p.classList.remove("active"));
        tab.classList.add("active");
        const panel = $("#panel-" + tab.dataset.panel);
        panel.classList.add("active");
        if (tab.dataset.panel === "cards") startCards();
        if (tab.dataset.panel === "quiz") startQuiz();
        if (tab.dataset.panel === "speak") startSpeak();
        refreshBadges();
      });
    });

    // 離開/切換分頁時徽章可能已經變化，簡單輪詢更新一次
    setInterval(refreshBadges, 2000);
  </script>
</body>
</html>
