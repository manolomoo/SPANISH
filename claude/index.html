<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>西班牙文跟讀練習站</title>
<link rel="stylesheet" href="./css/style.css?v=11">
</head>
<body>
  <div class="topbar">
    <span class="back" style="visibility:hidden">←</span>
    <h1>🐾 西班牙文跟讀練習站</h1>
    <button class="theme-btn" type="button">🌙</button>
  </div>

  <div class="wrap">
    <div class="hero">
      <h1>Hola! 開始今天的練習</h1>
      <p>繁中介面・回音法跟讀・黑狗徽章・RPG 升級</p>
    </div>

    <div id="charCard"></div>

    <h2 class="section-title">單元列表</h2>
    <div id="unitList"></div>

    <footer class="sitefoot">
      所有進度存在你瀏覽器的 localStorage，換裝置或清除資料會重新開始。<br>
      純前端靜態網站，無後端、無追蹤。
    </footer>
  </div>

  <script src="./js/app.js?v=11"></script>
  <script src="./js/rewards.js?v=11"></script>
  <script src="./data/audio-manifest.js?v=11"></script>
  <script src="./data/u0-data.js?v=11"></script>
  <script src="./data/u1-data.js?v=11"></script>
  <script src="./data/u2-data.js?v=11"></script>
  <script src="./data/u3-data.js?v=11"></script>
  <script src="./data/u4-data.js?v=11"></script>
  <script src="./data/u5-data.js?v=11"></script>
  <script src="./js/unit-engine.js?v=11"></script>
  <script>
    "use strict";

    function totalsFor(unitId) {
      const raw = window.UNIT_DATA && window.UNIT_DATA[unitId];
      if (!raw) return null;
      if (raw.G) {
        const deck = UnitEngine.fromGQD(unitId, raw);
        return { cards: deck.cards.length, speak: deck.speak.length, story: 0 };
      }
      if (raw.W) {
        const deck = UnitEngine.fromWordlist(unitId, raw);
        return { cards: deck.cards.length, speak: deck.speak.length, story: deck.story.length };
      }
      return null;
    }

    function renderUnitList() {
      const list = $("#unitList");
      list.innerHTML = "";
      UNITS.forEach((u) => {
        const hasData = !!(window.UNIT_DATA && window.UNIT_DATA[u.id]);
        const totals = hasData ? totalsFor(u.id) : null;
        const king = hasData && Rewards.isUnitKing(u.id, u.kinds, totals || {});
        const card = el("a", { class: "unit-card" + (hasData ? "" : " stub") + (king ? " king" : ""), href: hasData ? `./${u.id}.html` : "#" });
        if (!hasData) {
          card.addEventListener("click", (e) => {
            e.preventDefault();
            alert("這個單元還在製作中，敬請期待！");
          });
        }
        card.appendChild(el("div", { class: "num" }, [u.num]));
        const meta = el("div", { class: "meta" }, [
          el("div", { class: "title" }, [u.title + (hasData ? "" : "（即將推出）")]),
          el("div", { class: "sub" }, [u.sub]),
        ]);
        card.appendChild(meta);
        const dogs = el("div", { class: "dogs" });
        u.kinds.forEach((kind) => {
          const st = hasData ? Rewards.getBadgeStatus(u.id, kind, totals || {}) : { done: false, crown: false };
          const span = el("span", {}, [st.crown ? "🐕👑" : st.done ? "🐕" : "🐾"]);
          span.style.opacity = st.done || st.crown ? "1" : "0.35";
          dogs.appendChild(span);
        });
        card.appendChild(dogs);
        list.appendChild(card);
      });
    }

    document.addEventListener("DOMContentLoaded", () => {
      Rewards.renderCharCard($("#charCard"));
      renderUnitList();
    });
  </script>
</body>
</html>
