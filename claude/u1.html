<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>單元 1｜冠詞 Artículos</title>
<link rel="stylesheet" href="./css/style.css?v=11">
</head>
<body>
  <div class="topbar"></div>

  <div class="wrap">
    <div class="hero">
      <h1>單元 1・冠詞</h1>
      <p>Artículos — 定冠詞 el/la/los/las，不定冠詞 un/una/unos/unas</p>
    </div>

    <div id="badgeRow"></div>

    <div class="note-box">
      <b>冠詞規則：</b>西文名詞有<b>陽性／陰性</b>、<b>單數／複數</b>，冠詞要跟著名詞變化。<br>
      定冠詞（the）：陽性單數 <b>el</b>、陰性單數 <b>la</b>、陽性複數 <b>los</b>、陰性複數 <b>las</b>。<br>
      不定冠詞（a/an/some）：陽性單數 <b>un</b>、陰性單數 <b>una</b>、陽性複數 <b>unos</b>、陰性複數 <b>unas</b>。<br>
      大部分以 <b>-o</b> 結尾的字是陽性、<b>-a</b> 結尾是陰性，但也有例外，要跟著單字一起背冠詞。
    </div>

    <div class="tabs">
      <div class="tab active" data-panel="cards">🖼 圖卡</div>
      <div class="tab" data-panel="quiz">📝 測驗</div>
      <div class="tab" data-panel="speak">🗣 口說</div>
    </div>

    <div class="panel active" id="panel-cards"></div>
    <div class="panel" id="panel-quiz"></div>
    <div class="panel" id="panel-speak"></div>
  </div>

  <script src="./js/app.js?v=11"></script>
  <script src="./js/rewards.js?v=11"></script>
  <script src="./data/audio-manifest.js?v=11"></script>
  <script src="./data/u1-data.js?v=11"></script>
  <script src="./js/unit-engine.js?v=11"></script>
  <script>
    "use strict";
    const UNIT_ID = "u1";
    const KINDS = ["cards", "quiz", "speak"];

    renderTopbar("單元 1・冠詞");

    const raw = window.UNIT_DATA.u1;
    const deck = UnitEngine.fromWordlist(UNIT_ID, raw);
    const totals = { cards: deck.cards.length, speak: deck.speak.length, story: 0 };

    function refreshBadges() {
      Rewards.renderBadgeRow($("#badgeRow"), UNIT_ID, KINDS, totals);
    }
    refreshBadges();

    let cardsStarted = false, quizStarted = false, speakStarted = false;

    function startCards() {
      if (cardsStarted) return;
      cardsStarted = true;
      new UnitEngine.CardEchoPlayer($("#panel-cards"), UNIT_ID, deck.cards, deck.groups);
    }
    function startQuiz() {
      if (quizStarted) return;
      quizStarted = true;
      new UnitEngine.QuizRunner($("#panel-quiz"), UNIT_ID, deck.quiz, { sessionSize: 12 });
    }
    function startSpeak() {
      if (speakStarted) return;
      speakStarted = true;
      new UnitEngine.SpeakRunner($("#panel-speak"), UNIT_ID, deck.speak);
    }
    startCards();

    $all(".tab").forEach((tab) => {
      tab.addEventListener("click", () => {
        $all(".tab").forEach((t) => t.classList.remove("active"));
        $all(".panel").forEach((p) => p.classList.remove("active"));
        tab.classList.add("active");
        const panel = $("#panel-" + tab.dataset.panel);
        panel.classList.add("active");
        if (tab.dataset.panel === "cards") startCards();
        if (tab.dataset.panel === "quiz") startQuiz();
        if (tab.dataset.panel === "speak") startSpeak();
        refreshBadges();
      });
    });

    setInterval(refreshBadges, 2000);
  </script>
</body>
</html>
