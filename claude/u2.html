<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>單元 2｜冠詞＋單字 Artículos + Vocabulario</title>
<link rel="stylesheet" href="./css/style.css?v=11">
</head>
<body>
  <div class="topbar"></div>

  <div class="wrap">
    <div class="hero">
      <h1>單元 2・冠詞＋單字</h1>
      <p>Artículos + Vocabulario — 更多名詞＋冠詞，最後用短文把單字串起來</p>
    </div>

    <div id="badgeRow"></div>

    <div class="note-box">
      <b>複習：</b>冠詞要跟著名詞的<b>陽性／陰性</b>、<b>單數／複數</b>變化：
      <b>el/la/los/las</b>（the）、<b>un/una/unos/unas</b>（a/an/some）。<br>
      這個單元的單字更多，記得把<b>冠詞也一起背下來</b>，最後的短文會把所有單字放進真實句子裡。
    </div>

    <div class="tabs">
      <div class="tab active" data-panel="cards">🖼 圖卡</div>
      <div class="tab" data-panel="quiz">📝 測驗</div>
      <div class="tab" data-panel="speak">🗣 口說</div>
      <div class="tab" data-panel="story">📖 短文</div>
    </div>

    <div class="panel active" id="panel-cards"></div>
    <div class="panel" id="panel-quiz"></div>
    <div class="panel" id="panel-speak"></div>
    <div class="panel" id="panel-story"></div>
  </div>

  <script src="./js/app.js?v=11"></script>
  <script src="./js/rewards.js?v=11"></script>
  <script src="./data/audio-manifest.js?v=11"></script>
  <script src="./data/u2-data.js?v=11"></script>
  <script src="./js/unit-engine.js?v=11"></script>
  <script>
    "use strict";
    const UNIT_ID = "u2";
    const KINDS = ["cards", "quiz", "speak", "story"];

    renderTopbar("單元 2・冠詞＋單字");

    const raw = window.UNIT_DATA.u2;
    const deck = UnitEngine.fromWordlist(UNIT_ID, raw);
    const totals = { cards: deck.cards.length, speak: deck.speak.length, story: deck.story.length };

    function refreshBadges() {
      Rewards.renderBadgeRow($("#badgeRow"), UNIT_ID, KINDS, totals);
    }
    refreshBadges();

    let cardsStarted = false, quizStarted = false, speakStarted = false, storyStarted = false;

    function startCards() {
      if (cardsStarted) return;
      cardsStarted = true;
      new UnitEngine.CardEchoPlayer($("#panel-cards"), UNIT_ID, deck.cards, deck.groups);
    }
    function startQuiz() {
      if (quizStarted) return;
      quizStarted = true;
      new UnitEngine.QuizRunner($("#panel-quiz"), UNIT_ID, deck.quiz, { sessionSize: 12 });
    }
    function startSpeak() {
      if (speakStarted) return;
      speakStarted = true;
      new UnitEngine.SpeakRunner($("#panel-speak"), UNIT_ID, deck.speak);
    }
    function startStory() {
      if (storyStarted) return;
      storyStarted = true;
      new UnitEngine.StoryRunner($("#panel-story"), UNIT_ID, deck.story);
    }
    startCards();

    $all(".tab").forEach((tab) => {
      tab.addEventListener("click", () => {
        $all(".tab").forEach((t) => t.classList.remove("active"));
        $all(".panel").forEach((p) => p.classList.remove("active"));
        tab.classList.add("active");
        const panel = $("#panel-" + tab.dataset.panel);
        panel.classList.add("active");
        if (tab.dataset.panel === "cards") startCards();
        if (tab.dataset.panel === "quiz") startQuiz();
        if (tab.dataset.panel === "speak") startSpeak();
        if (tab.dataset.panel === "story") startStory();
        refreshBadges();
      });
    });

    setInterval(refreshBadges, 2000);
  </script>
</body>
</html>
